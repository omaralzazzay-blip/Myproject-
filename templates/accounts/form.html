{% extends 'base.html' %}
{% block title %}حساب جديد{% endblock %}
{% block content %}
<div class="card p-4" style="max-width:640px">
  <h5 class="page-title mb-4"><i class="bi bi-journal-plus me-2"></i>إضافة حساب</h5>
  <form method="post" action="{{ url_for('accounts.add_account') }}">
    <div class="mb-3"><label class="form-label">اسم الحساب *</label>
      <input class="form-control" name="name" required placeholder="مثال: مدين - شركة المقاولات الفرعية"></div>
    <div class="row g-3 mb-3">
      <div class="col-md-6"><label class="form-label">نوع الحساب *</label>
        <select class="form-select" name="acc_type" id="acc_type" onchange="toggleAcc()">
          <option value="debtor">مدين (يُعترف به عند التحصيل)</option>
          <option value="creditor">دائن (يُخصم من الميزانية فوراً)</option>
          <option value="project">حساب مشروع رئيسي</option>
        </select></div>
      <div class="col-md-6"><label class="form-label">المشروع *</label>
        <select class="form-select" name="project_id" required>
          <option value="">— اختر —</option>
          {% for p in projects %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}
        </select></div>
      <div class="col-md-6"><label class="form-label" id="amount_label">الرصيد الافتتاحي (للدائن: يُخصم فوراً من الميزانية)</label>
        <input type="number" step="any" class="form-control" name="amount" value="0"></div>
      <div class="col-md-6"><label class="form-label">العملة</label>
        <select class="form-select" name="currency_id">
          {% for c in currencies %}<option value="{{ c.id }}" {{ 'selected' if c.is_local }}>{{ c.code }}</option>{% endfor %}
        </select></div>
      <div class="col-12"><div class="form-check">
        <input class="form-check-input" type="checkbox" name="collected" id="collected" value="1">
        <label class="form-check-label" for="collected">محصّل فعلياً (للمدين: الاعتراف به نقدياً عند التحصيل)</label>
      </div></div>
      <div class="col-12"><label class="form-label">وصف</label>
        <input class="form-control" name="description"></div>
    </div>
    <div class="alert alert-light border small mb-3">
      <i class="bi bi-info-circle me-1"></i>
      <strong>المدين:</strong> يُعترف به عند تحصيله فعلياً (أساس الاستحقاق النقدي للمدين).<br>
      <strong>الدائن:</strong> يُخصم مباشرة من ميزانية المشروع عبر حسابه الرئيسي.
    </div>
    <button class="btn btn-primary px-4">حفظ</button>
    <a class="btn btn-light" href="{{ url_for('accounts.list_accounts') }}">إلغاء</a>
  </form>
</div>
<script>
function toggleAcc(){
  const t = document.getElementById('acc_type').value;
  document.getElementById('collected').style.display = (t=='debtor') ? '' : 'none';
  document.getElementById('amount_label').innerHTML = (t=='creditor')
    ? 'الرصيد الافتتاحي (يُخصم فوراً من الميزانية)'
    : (t=='debtor' ? 'الرصيد الافتتاحي (يُعترف به عند التحصيل)' : 'رصيد افتتاحي (اختياري)');
}
toggleAcc();
</script>
{% endblock %}
